limit_req_zone $binary_remote_addr zone=laka_login:1m rate=3r/m;
server {
    listen 80;
    listen [::]:80;
    server_name 139.180.223.190;
    if ($host != 139.180.223.190) { return 444; }
    location /.well-known/acme-challenge/ { root /var/www/laka-acme; }
    location / { return 301 https://139.180.223.190$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 139.180.223.190;
    if ($host != 139.180.223.190) { return 444; }
    ssl_certificate /etc/letsencrypt/live/139.180.223.190/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/139.180.223.190/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    access_log /var/log/nginx/laka-warehouse.access.log;
    error_log /var/log/nginx/laka-warehouse.error.log;
    location = /api/auth/login {
        if (-f /run/laka-warehouse-maintenance) { return 503; }
        limit_req zone=laka_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        if (-f /run/laka-warehouse-maintenance) { return 503; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
